[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort import sorting
    "N",    # pep8 naming
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
verbose = true
addopts = "--cov=email_service --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["email_service", "app"]
omit = [
    "tests/*",
    "*/site-packages/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 75
omit = [
    "tests/*"
    "*/site-packages/*"
]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]

